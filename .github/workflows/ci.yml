name: CI

on:
  push:
    branches: [master, main, feat-optimizations]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint-and-security:
    name: Lint & security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only the lint/security tools so this job stays fast
          # and doesn't pull in libldap/etc. Runtime deps are exercised
          # by the tests job below.
          pip install \
            ruff==0.6.9 \
            bandit==1.7.10 \
            pip-audit==2.7.3

      - name: Ruff (lint)
        # Tight ruleset focused on real bugs:
        #   F   = pyflakes (undefined names, unused imports/vars)
        #   B   = bugbear (likely-buggy patterns)
        #   W6  = invalid escape sequences (W605)
        # Pure-style rules (E/W1-W5) are deliberately excluded — the
        # codebase predates ruff and we don't want CI red on whitespace.
        # B006/B904/B905/B007 are tracked tech-debt; ignore for now.
        run: |
          ruff check \
            --select F,B,W6 \
            --ignore B006,B904,B905,B007 \
            powerdnsadmin

      - name: Bandit (security)
        # -ll: report only MEDIUM+ severity findings; LOW is too noisy
        # for an existing codebase. Tests directory is excluded.
        run: bandit -r powerdnsadmin -ll -x powerdnsadmin/tests

      - name: pip-audit (CVE scan)
        # --strict turns warnings into failures so CI goes red on any
        # new CVE in our pinned deps. The --ignore-vuln list covers
        # CVEs whose only fix requires a major-version migration that
        # is tracked as a separate work item in §5/§8 of the audit
        # (Flask 3 / Werkzeug 3 / Authlib 1.6 / cryptography 46 /
        # lxml 6 / requests 2.33 / pyasn1 0.6). Re-evaluate this list
        # whenever any of those upgrades land.
        run: |
          pip-audit --strict -r requirements.txt \
            --ignore-vuln CVE-2025-59420 \
            --ignore-vuln CVE-2025-61920 \
            --ignore-vuln CVE-2025-62706 \
            --ignore-vuln CVE-2025-68158 \
            --ignore-vuln CVE-2026-27962 \
            --ignore-vuln CVE-2026-28490 \
            --ignore-vuln GHSA-jj8c-mmj3-mmgv \
            --ignore-vuln CVE-2026-27205 \
            --ignore-vuln CVE-2026-26007 \
            --ignore-vuln CVE-2026-34073 \
            --ignore-vuln CVE-2026-41066 \
            --ignore-vuln CVE-2026-30922 \
            --ignore-vuln CVE-2026-25645 \
            --ignore-vuln CVE-2024-34069 \
            --ignore-vuln CVE-2024-49766 \
            --ignore-vuln CVE-2024-49767 \
            --ignore-vuln CVE-2025-66221 \
            --ignore-vuln CVE-2026-21860 \
            --ignore-vuln CVE-2026-27199

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # libldap/libsasl needed by python-ldap; libxmlsec1 by python3-saml.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libldap2-dev libsasl2-dev libxmlsec1-dev libxml2-dev \
            pkg-config build-essential

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        # The integration suite needs a live PowerDNS; only run unit tests in CI.
        run: pytest tests/unit -q
